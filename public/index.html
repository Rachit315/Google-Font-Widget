<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8" />
<script>document.documentElement.classList.add('js');</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Google Font widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="h-full bg-ink antialiased">

  <main class="grid min-h-full w-full place-items-center p-6">

    <!-- CARD -->
    <article id="card" class="card group relative w-[min(92vw,460px)] rounded-[26px] bg-paper p-[13px]">

      <!-- DISPLAY PANEL -->
      <section id="panel" class="panel relative aspect-[1/0.99] w-full overflow-hidden rounded-[17px] bg-panel">
        <canvas id="matrix" class="absolute inset-0 h-full w-full"></canvas>

        <div class="pointer-events-none absolute inset-0 px-[5cqw] pt-[4cqw]">
          <p data-reveal class="t-label m-0 leading-none tracking-[-0.01em] text-white/95">Downloads</p>
          <p data-reveal id="counter" class="t-hero numeral m-0 font-medium leading-[0.8] tracking-[-0.05em] text-[#f2f2f2]">0.0M</p>
        </div>
      </section>

      <!-- FOOTER -->
      <footer class="mt-[13px] flex items-stretch gap-[7cqw]">
        <div data-reveal id="tile" class="tile grid aspect-square w-[32.5%] shrink-0 place-items-center rounded-[16px] bg-brand">
          <span id="sample" class="sample t-tile select-none font-bold leading-none tracking-[-0.05em] text-black">Aa</span>
        </div>

        <div class="flex min-w-0 flex-1 flex-col justify-center gap-[1.2cqw] pr-[2cqw]">
          <p data-reveal class="t-meta m-0 flex items-center gap-[0.6em] font-medium uppercase tracking-[0.045em] text-muted">
            <span class="inline-block h-[0.52em] w-[0.52em] rounded-full bg-muted"></span>
            Google Fonts
          </p>

          <!-- font picker: the title is the trigger, so the composition is unchanged -->
          <div class="relative flex min-w-0 items-center gap-[1.6cqw]">
            <h1 id="fontName" data-reveal class="t-title m-0 min-w-0 truncate font-semibold leading-none tracking-[-0.035em] text-black">Stack Sans</h1>

            <button
              id="fontTrigger"
              data-reveal
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="Choose a font"
              class="chevron relative grid shrink-0 place-items-center rounded-full text-black/45"
            >
              <svg viewBox="0 0 12 12" fill="none" aria-hidden="true" class="h-[3.2cqw] w-[3.2cqw]">
                <path d="M2.75 4.5 6 7.75 9.25 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>

            <div id="fontMenu" class="menu" role="listbox" aria-label="Google Fonts" tabindex="-1" hidden></div>
          </div>
        </div>
      </footer>
    </article>

    <!-- credit line: outside the card, so the composition is untouched -->
    <p class="credit">
      Inspiration from
      <a
        id="pinLink"
        class="link"
        href="https://in.pinterest.com/pin/1056657131344671465/"
        target="_blank"
        rel="noopener noreferrer"
      >Pinterest.com</a>
    </p>
  </main>

  <!-- Link preview. Follows the cursor while the link is hovered. -->
  <div id="linkPreview" class="preview" role="tooltip" aria-hidden="true" hidden>
    <div class="preview-bar">
      <span class="preview-dot"></span>
      <span class="preview-url">in.pinterest.com</span>
    </div>

    <div class="preview-shot">
      <!-- Drop a real screenshot at public/pin-preview.png and it is used here;
           the drawn mockup below stands in until then. -->
      <img id="previewShot" alt="" hidden />

      <div class="preview-mock" aria-hidden="true">
        <div class="pm-rail">
          <span class="pm-logo"></span>
          <span class="pm-ico"></span>
          <span class="pm-ico"></span>
          <span class="pm-ico"></span>
        </div>

        <div class="pm-page">
          <span class="pm-search"></span>

          <div class="pm-row">
            <div class="pm-pin">
              <div class="pm-art">
                <div class="pm-card">
                  <div class="pm-panel"><span>2,3m.</span></div>
                  <div class="pm-foot"><span class="pm-tile">Aa</span></div>
                </div>
              </div>

              <div class="pm-side">
                <span class="pm-line pm-title"></span>
                <span class="pm-line pm-title pm-short"></span>
                <span class="pm-save"></span>
                <span class="pm-line"></span>
                <span class="pm-line pm-short"></span>
              </div>
            </div>

            <div class="pm-grid">
              <span class="pm-tileA"></span>
              <span class="pm-tileB"></span>
              <span class="pm-tileC"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="preview-title">Stack Overflow Rebrand: A legacy recoded | Koto</p>
  </div>

  <script src="/vendor/motion.js"></script>
  <script src="/main.js"></script>
</body>
</html>
